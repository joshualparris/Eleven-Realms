name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run missions:validate
      - run: npm run missions:audit
      - run: npm run fleet:verify
      - run: npm test
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run build
